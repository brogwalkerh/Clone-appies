    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);

  }

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 20px;
    max-width: 1300px;
    margin: 0 auto;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;

  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 120px; }
  .field label { font-size: 13px; font-weight: 600; }
  input[type=text], input[type=password], select, textarea {
    font: inherit;
    color: var(--text);
    background: var(--input-bg);
    border: 1px solid var(--border);

/* ---------- Generic-review detection ---------- */

const TRIGGER_WORDS = [
  "but", "however", "unfortunately", "disappointed", "issue", "problem", "broken",
  "dirty", "noise", "noisy", "smell", "rude", "slow", "wait", "charge", "charged",
  "fee", "parking", "shuttle", "breakfast", "bar", "pool", "elevator",

// Capitalized words that are normal in a review and are not people's names.
const NAME_ALLOWLIST = new Set([
  "i", "i'm", "i've", "i'd", "i'll", "we", "the", "a", "an", "and", "our", "my", "it", "this",
  "courtyard", "marriott", "bonvoy", "san", "diego", "liberty", "station", "airport", "hotel",
  "point", "loma", "market", "public", "lounge", "bistro", "starbucks", "stone", "brewing",
  "breakfast", "republic", "tender", "greens", "oggi's", "slater's", "vons", "trader", "joe's",
  "california", "ca", "usa", "us", "tripadvisor", "expedia", "booking", "orbitz", "travelocity",
  "gold", "platinum", "titanium", "ambassador", "elite", "silver", "member",
  "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday",
  "january", "february", "march", "april", "may", "june", "july", "august",
  "september", "october", "november", "december",
  "great", "excellent", "wonderful", "amazing", "perfect", "love", "loved", "very",
  "staff", "everyone", "everything", "thanks", "thank", "you", "will", "would",
  "highly", "recommend", "definitely", "best", "nice", "good", "clean", "friendly",
  "front", "desk", "team", "room", "stay", "location", "fantastic", "awesome", "overall",
  "convenient", "close", "beautiful", "lovely", "comfortable", "easy", "super"
]);

function escapeRegex(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
}

function findTriggerWord(text) {
  for (const w of TRIGGER_WORDS) {
    const re = new RegExp("(^|[^a-z0-9])" + escapeRegex(w) + "s?(?![a-z0-9])", "i");
    if (re.test(text)) return w;
  }
  // "AC" is checked case-sensitively so ordinary words are not caught.
  if (/(^|[^A-Za-z0-9])A\/?C(?![A-Za-z0-9])/.test(text)) return "AC";
  return null;
}

function findRoomNumber(text) {
  const m = text.match(/\b(room|rm|suite|unit)\.?\s*(#|no\.?|number)?\s*\d{2,4}\b/i) ||
            text.match(/#\s*\d{3,4}\b/);
  return m ? m[0] : null;
}

// Heuristic: a capitalized word that is not at the start of a sentence and is not
// a known place, brand, or common word is treated as a possible person's name.
function findOtherName(text, guestLast) {
  const guest = (guestLast || "").trim().toLowerCase();
  const re = /[A-Za-z][A-Za-z'’-]*/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const word = m[0].replace(/’/g, "'");
    if (!/^[A-Z][a-z]/.test(word)) continue;
    const lower = word.toLowerCase();
    if (NAME_ALLOWLIST.has(lower) || lower === guest) continue;
    const before = text.slice(0, m.index).replace(/\s+$/, "");
    const sentenceStart = before === "" || /[.!?\n:;"(]$/.test(before);
    if (sentenceStart) continue;
    return word;
  }
  return null;
}

/* ---------- Storage helpers (never throw) ---------- */

function store(key, value) {
  try { localStorage.setItem(key, value); } catch (e) { /* storage unavailable */ }
}
function load(key) {
  try { return localStorage.getItem(key); } catch (e) { return null; }
}
function unstore(key) {
  try { localStorage.removeItem(key); } catch (e) { /* storage unavailable */ }
}

function saveForm() {
  const data = {};
  for (const f of FORM_FIELDS) {
    data[f] = el[f].type === "checkbox" ? el[f].checked : el[f].value;
  }
  data.output = el.output.value;
  store(FORM_STORAGE, JSON.stringify(data));
}

function restoreForm() {
  let data = null;
  try { data = JSON.parse(load(FORM_STORAGE) || "null"); } catch (e) { data = null; }
  if (!data) return;
  for (const f of FORM_FIELDS) {
    if (!(f in data)) continue;
    if (el[f].type === "checkbox") el[f].checked = !!data[f];
    else el[f].value = data[f];
  }
  if (!el.model.value) el.model.value = "claude-sonnet-5-5";
  if (data.output) el.output.value = data.output;
}

/* ---------- Score helpers ---------- */

// Returns a 1-10 number, or null when there is no usable score.
function effectiveScore() {
  if (el.score.value !== "N/A") return Number(el.score.value);
  const stars = parseFloat(el.stars.value);
  if (!stars) return null;
  if (stars >= 5) return 10;
  if (stars >= 4.5) return 9;
  return Math.round(stars * 2);
}

function scoreLine() {
  if (el.score.value !== "N/A") return el.score.value + "/10";
  const s = effectiveScore();
  if (s === null) return "N/A (star-based review, no star rating given)";
  return s + "/10 (" + el.stars.value + " stars)";
}

/* ---------- Generic check ---------- */

function genericVerdict() {
  const text = el.review.value.trim();
  const s = effectiveScore();
  if (!text) return { generic: false, reason: "" };
  if (s === null || s < 9) return { generic: false, reason: "Score below 9 - routed to the model." };
  if (text.length >= 300) return { generic: false, reason: "Review is 300+ characters - routed to the model." };
  const word = findTriggerWord(text);
  if (word) return { generic: false, reason: "Mentions \"" + word + "\" - routed to the model." };
  const room = findRoomNumber(text);
  if (room) return { generic: false, reason: "Mentions a room number (" + room + ") - routed to the model." };
  const name = findOtherName(text, el.lastName.value);
  if (name) return { generic: false, reason: "Possible name (\"" + name + "\") - routed to the model." };
  return { generic: true, reason: "Short, specific-free 9-10 review - canned response suggested." };
}

function autoCheckGeneric() {
  const v = genericVerdict();
  el.generic.checked = v.generic;
  el.genericReason.textContent = v.reason;
}

/* ---------- UI state ---------- */

function updateUI() {
  el.starsField.classList.toggle("show", el.score.value === "N/A");
  el.reviewCount.textContent = el.review.value.length + " characters";
  el.nextCannedBtn.disabled = busy || !el.generic.checked;
  el.generateBtn.disabled = busy;
  el.regenBtn.disabled = busy || lastPath !== "api";
}

function setStatus(msg, kind) {
  el.status.textContent = msg;
  el.status.className = "status" + (kind ? " " + kind : "");
}

function setBusy(on, button) {
  busy = on;
  el.generateBtn.classList.toggle("busy", on && button === el.generateBtn);
  el.regenBtn.classList.toggle("busy", on && button === el.regenBtn);
  updateUI();
}

function refreshKeyState() {
  const key = load(KEY_STORAGE);
  if (key) {
    const tail = key.slice(-4);
    el.keyState.textContent = "Saved key: " + key.slice(0, 7) + "•".repeat(8) + tail;
  } else {
    el.keyState.textContent = "No key saved.";
  }
}

/* ---------- Canned path ---------- */

function greeting() {
  return "Dear " + el.honorific.value + " " + el.lastName.value.trim() + ",";
}

function buildCanned(i) {
  const [opening, middle, closing] = CANNED[i];
  return [greeting(), opening, middle, TRIPADVISOR_PARAGRAPH, closing, SIGNATURE].join("\n\n");
}

function showNextCanned() {
  let idx = parseInt(load(CANNED_INDEX_STORAGE) || "0", 10);
  if (!(idx >= 0 && idx < CANNED.length)) idx = 0;
  el.output.value = buildCanned(idx);
  store(CANNED_INDEX_STORAGE, String((idx + 1) % CANNED.length));
  lastPath = "canned";
  setStatus("Canned #" + (idx + 1) + " of " + CANNED.length + " (no API call)", "ok");
  saveForm();
  updateUI();
}

/* ---------- API path ---------- */

function buildUserMessage() {
  const notes = el.notes.value.trim();
  return "Score: " + scoreLine() + "\n" +
    "Source: " + el.source.value + "\n" +
    "Guest: " + el.honorific.value + " " + el.lastName.value.trim() + "\n" +
    "Internal notes (context only, never quote to the guest): " + (notes || "none") + "\n\n" +
    "Review:\n" + el.review.value.trim();
}

function errorMessage(status, body) {
  const apiMsg = body && body.error && body.error.message ? " (" + body.error.message + ")" : "";
  if (status === 401) return "The API key was rejected (401). Check the key in Settings.";
  if (status === 403) return "This API key is not allowed to use that model (403)." + apiMsg;
  if (status === 429) return "Rate limited (429). Wait a moment and try again.";
  if (status === 529 || (body && body.error && body.error.type === "overloaded_error"))
    return "Anthropic's servers are overloaded right now (529). Try again shortly, or pick another model.";
  if (status >= 500) return "Anthropic's API had a server error (" + status + "). Try again shortly.";
  if (status === 400) return "The request was rejected (400)." + apiMsg;
  return "Request failed (" + status + ")." + apiMsg;
}

async function callApi(button) {
  const key = load(KEY_STORAGE);
  if (!key) {
    setStatus("No API key set. Click the gear icon to add one.", "error");
    openSettings(true);
    return;
  }

  const model = el.model.value;
  const body = {
    model: model,
    max_tokens: 1024,
    system: SYSTEM_PROMPT,
    messages: [{ role: "user", content: buildUserMessage() }],
    // A short letter needs little reasoning; low effort keeps thinking inside the 1024-token cap.
    output_config: { effort: "low" }
  };
  const headers = {
    "x-api-key": key,
    "anthropic-version": "2023-06-01",
    "content-type": "application/json",
    "anthropic-dangerous-direct-browser-access": "true"
  };
  if (FALLBACK_MODELS.has(model)) {
    // If a safety classifier declines the request, retry server-side on a suitable model.
    headers["anthropic-beta"] = "server-side-fallback-2026-07-01";
    body.fallbacks = "default";
  }

  setBusy(true, button);
  setStatus("Generating with " + MODEL_LABELS[model] + "…");

  let res, data = null;
  try {
    res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: headers,
      body: JSON.stringify(body)
    });
    try { data = await res.json(); } catch (e) { data = null; }
  } catch (e) {
    setBusy(false);
    setStatus("Network error: could not reach api.anthropic.com. Check your connection and try again.", "error");
    return;
  }
  setBusy(false);

  if (!res.ok) {
    setStatus(errorMessage(res.status, data), "error");
    return;
  }

  if (data && data.stop_reason === "refusal") {
    setStatus("The model declined to write this response. Try rewording the notes or picking another model.", "error");
    return;
  }

  // Thinking blocks can come before the text, so take the first text block.
  const textBlock = (data && Array.isArray(data.content))
    ? data.content.find((b) => b.type === "text" && b.text && b.text.trim())
    : null;
  if (!textBlock) {
    const why = data && data.stop_reason === "max_tokens" ? " (ran out of tokens)" : "";
    setStatus("The model returned no letter" + why + ". Try Regenerate.", "error");
    return;
  }

  el.output.value = textBlock.text.trim();
  lastPath = "api";
  saveForm();

  const usage = data.usage || {};
  let msg = "Generated with " + MODEL_LABELS[model] +
    " · " + (usage.input_tokens ?? "?") + " input / " + (usage.output_tokens ?? "?") + " output tokens";
  if (data.model && data.model !== model) msg += " · served by " + data.model + " (fallback)";
  if (data.stop_reason === "max_tokens") msg += " · letter may be cut off";
  setStatus(msg, data.stop_reason === "max_tokens" ? "error" : "ok");
  updateUI();
}

/* ---------- Actions ---------- */

function validate() {
  if (!el.lastName.value.trim()) {
    setStatus("Enter the guest's last name.", "error");
    el.lastName.focus();
    return false;
  }
  if (!el.generic.checked && !el.review.value.trim()) {
    setStatus("Paste the review text first.", "error");
    el.review.focus();
    return false;
  }
  return true;
}

function generate() {
  if (busy || !validate()) return;
  if (el.generic.checked) showNextCanned();
  else callApi(el.generateBtn);
}

function regenerate() {
  if (busy || !validate()) return;
  callApi(el.regenBtn);
}

async function copyOutput() {
  const text = el.output.value;
  if (!text) { setStatus("Nothing to copy yet.", "error"); return; }
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      ok = true;
    }
  } catch (e) { ok = false; }
  if (!ok) {
    // Fallback for browsers that block the async clipboard API on file://
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
  }
  if (ok) {
    el.copyBtn.textContent = "Copied";
    setTimeout(() => { el.copyBtn.textContent = "Copy"; }, 2000);
  } else {
    setStatus("Copy failed. Select the letter and press Cmd/Ctrl+C.", "error");
  }
}

function clearForm() {
  el.lastName.value = "";
  el.honorific.value = "Mr.";
  el.score.value = "10";
  el.stars.value = "";
  el.source.value = "Medallia GSS";
  el.review.value = "";
  el.notes.value = "";
  el.generic.checked = false;
  el.genericReason.textContent = "";
  el.output.value = "";
  lastPath = null;
  setStatus("");
  saveForm();
  updateUI();
}

function openSettings(force) {
  const open = force === true ? true : !el.settings.classList.contains("open");
  el.settings.classList.toggle("open", open);
  el.gearBtn.setAttribute("aria-expanded", String(open));
  if (open) el.apiKey.focus();
}

/* ---------- Wiring ---------- */

el.gearBtn.addEventListener("click", () => openSettings());
el.saveKeyBtn.addEventListener("click", () => {
  const v = el.apiKey.value.trim();
  if (!v) return;
  store(KEY_STORAGE, v);
  el.apiKey.value = "";
  refreshKeyState();
  setStatus("API key saved in this browser.", "ok");
});
el.apiKey.addEventListener("keydown", (e) => { if (e.key === "Enter") el.saveKeyBtn.click(); });
el.clearKeyBtn.addEventListener("click", () => {
  unstore(KEY_STORAGE);
  el.apiKey.value = "";
  refreshKeyState();
  setStatus("API key cleared.");
});

// Inputs that affect the generic verdict re-run the auto-check; the user can still override the box.
for (const f of ["score", "stars", "review", "lastName"]) {
  el[f].addEventListener("input", () => { autoCheckGeneric(); saveForm(); updateUI(); });
}
for (const f of ["model", "honorific", "source", "notes"]) {
  el[f].addEventListener("input", () => { saveForm(); updateUI(); });
  el[f].addEventListener("change", () => { saveForm(); updateUI(); });
}
el.generic.addEventListener("change", () => {
  el.genericReason.textContent = el.generic.checked
    ? "Canned response selected manually."
    : "Model response selected manually.";
  saveForm();
  updateUI();
});

el.generateBtn.addEventListener("click", generate);
el.nextCannedBtn.addEventListener("click", () => { if (validate()) showNextCanned(); });
el.regenBtn.addEventListener("click", regenerate);
el.copyBtn.addEventListener("click", copyOutput);
el.clearFormBtn.addEventListener("click", clearForm);

restoreForm();
refreshKeyState();
updateUI();
</script>
</body>
</html>
